<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#020817" />
        <meta name="description" content="MAADEC Job Tracker - Suivez vos candidatures d'emploi et entretiens efficacement" />
        
        <!-- PWA Meta Tags -->
        <meta name="application-name" content="JobTracker" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="JobTracker" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="msapplication-TileColor" content="#020817" />
        <meta name="msapplication-tap-highlight" content="no" />
        
        <!-- PWA Manifest -->
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        
        <!-- Favicon & Icons -->
        <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/icons/icon-96x96.png" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/icon-192x192.png" />
        <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/icons/icon-152x152.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/icons/icon-192x192.png" />
        <link rel="apple-touch-icon" sizes="167x167" href="%PUBLIC_URL%/icons/icon-192x192.png" />
        
        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        
        <title>JobTracker</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        
        <!-- Service Worker Registration -->
        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/service-worker.js')
                        .then(function(registration) {
                            console.log('[PWA] Service Worker enregistré:', registration.scope);
                            
                            // Helper pour notifier l'app React
                            function notifyUpdate(worker) {
                                window.dispatchEvent(new CustomEvent('pwa-update-available', { 
                                    detail: registration 
                                }));
                            }

                            // Si un update est déjà en attente au chargement
                            if (registration.waiting) {
                                console.log('[PWA] Service Worker en attente détecté au chargement');
                                notifyUpdate(registration.waiting);
                            }

                            // Vérifier les mises à jour futures
                            registration.addEventListener('updatefound', function() {
                                const newWorker = registration.installing;
                                newWorker.addEventListener('statechange', function() {
                                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                        // Nouvelle version disponible
                                        console.log('[PWA] Nouvelle version disponible!');
                                        notifyUpdate(newWorker);
                                    }
                                });
                            });
                        })
                        .catch(function(error) {
                            console.log('[PWA] Erreur Service Worker:', error);
                        });
                });
            }
        </script>

    </body>
</html>
